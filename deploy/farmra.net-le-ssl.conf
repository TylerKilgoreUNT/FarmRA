<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName farmra.net
    ServerAlias www.farmra.net
    DocumentRoot /var/www/html/farmra.net
    DirectoryIndex login.html index.html

    # --- Error logs ---
    ErrorLog ${APACHE_LOG_DIR}/farmra.net_error.log
    CustomLog ${APACHE_LOG_DIR}/farmra.net_error.log combined

    # --- SSL certificates for HTTPS ---
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/farmra.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/farmra.net/privkey.pem

    # --- OIDC information ---
    OIDCProviderMetadataURL https://accounts.google.com/.well-known/openid-configuration
    OIDCClientID {{OAUTH_CLIENT_ID}}
    OIDCClientSecret {{OAUTH_CLIENT_SECRET}}
    OIDCScope "openid email profile"
    OIDCCryptoPassphrase "your-super-secret-passphrase"

    # --- Dedicated unused callback page --- 
    OIDCRedirectURI https://farmra.net/oidc/callback

    # --- Default fallback page ---
    OIDCDefaultURL /index.html

    # --- Stores session in server and sets idle timeut to 1 hour ---
    OIDCSessionType server-cache
    OIDCSessionInactivityTimeout 3600

    # --- Public login page ---
    <Location /login.html>
        Require all granted
    </Location>

    # --- All pages protected by default ---
    # --- RequestHeader puts user email in http header ---
    <Location /index.html>
        AuthType openid-connect
        Require valid-user
        RequestHeader unset X-User-Email
        RequestHeader set X-User-Email %{OIDC_CLAIM_email}e
    </Location>

    # --- OIDC callback handler ---
    <Location /oidc/callback>
        AuthType openid-connect
        Require valid-user
    </Location>

    # --- Proxy to flask ---
    #ProxyPreserveHost On
    #ProxyPass / http://127.0.0.1:5000/
    #ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>