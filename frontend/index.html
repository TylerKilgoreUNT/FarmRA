<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/media.css" />
    <title>FarmRA</title>
    <script>
      // window.location.href = '/login.html';
    </script>
  </head>
  <body>
    <nav id="top-bar" class="top-bar" aria-label="Top navigation">
      <div class="farmra-logo">
        <img src="./assets/FarmRA.png" alt="Farm Ra Logo" />
        <span id="userGreeting" class="user-greeting"></span>
      </div>
      <div class="top-bar-left">
        <h1>FarmRA</h1>
      </div>
      <div class="top-bar-right">
        <div class="user-menu">
          <button
            class="icon-btn"
            title="User Settings"
            data-action="settings"
            id="userMenuBtn"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"
                fill="currentColor"
              />
            </svg>
          </button>
          <div class="dropdown-menu" id="userDropdown" hidden>
            <div class="menu-header">
              <span id="userEmail" class="user-email"></span>
            </div>
            <div class="menu-items">
              <a href="#" class="menu-item">
                <span>Account Info</span>
              </a>
              <hr class="menu-divider" />
              <a
                href="/oidc/callback?logout=https://farmra.net/login.html"
                class="menu-item text-danger"
              >
                <span>Log Out</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <nav
      id="left-panel"
      class="sidebar left-panel"
      aria-label="Secondary navigation"
    >
      <div class="sidebar-header">
        <h3>Sensor Nodes</h3>
      </div>
      <div class="sidebar-section">
        <button class="side-btn active" data-node="node1" type="button">Loading nodes...</button>
        <button class="side-btn" data-node="node2" type="button">Loading nodes...</button>
      </div>
    </nav>
    <nav
      id="left-narrow"
      class="sidebar left-narrow"
      aria-label="Primary navigation"
    >
      <div>
        <button class="icon-btn all" title="all" data-action="all"></button>
        <button
          class="icon-btn light"
          title="Light"
          data-action="light"
        ></button>
        <button
          class="icon-btn moisture"
          title="Moisture"
          data-action="moisture"
        ></button>
        <button
          class="icon-btn temperature"
          title="Temperature"
          data-action="temperature"
        ></button>
      </div>
      <div>
        <a href="map.html" class="icon-btn map" title="Map"></a>
      </div>
    </nav>
    <main>
      <output
        id="grafanaMainLoader"
        class="grafana-main-loader"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="true"
      >
        <div class="grafana-main-loader-inner">
          <img
            src="./assets/FarmRA_Loading.gif"
            alt="FarmRA loading"
            class="grafana-main-loader-logo"
          />
          <p id="grafanaMainLoaderText" class="grafana-main-loader-text">
            Loading dashboards...
          </p>
        </div>
      </output>
      <div class="grafana-flex"></div>
    </main>
    <div id="overlay" class="overlay" hidden></div>
    <script src="js/main.js" defer></script>
  </body>
</html>
