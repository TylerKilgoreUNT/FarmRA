<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/media.css" />
    <title>FarmRA</title>
  </head>
  <body class="login-page">
    <!-- Login -->
    <section class="login">
      <div class="login-container">
        <!-- Logo and Welcome Text -->
        <div class="login-logo">
          <img
            src="/assets/LightFarmRa.png"
            alt="FarmRA Logo"
            class="large-logo"
          />
          <h2>FarmRA</h2>
          <p class="welcome-text">Welcome to your farm of the future</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
          <div class="card-content">
            <h3>Get Started</h3>
            <p class="card-subtitle">Sign in to access your farm dashboard</p>

            <a href="/farmra-api/route_user" class="oauth-btn-primary">
              <img
                src="/assets/googleOAuth2.png"
                alt="Google sign in"
                class="oauth-icon"
              />
              <span>Sign in with Google</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <dialog
      id="loginAccessModal"
      class="login-alert-modal"
      aria-labelledby="loginAccessModalTitle"
      hidden
    >
      <header class="login-alert-header">
        <h2 id="loginAccessModalTitle">Account Not Registered</h2>
        <button
          id="loginAccessModalClose"
          class="login-alert-close"
          type="button"
          aria-label="Close message"
        >
          ×
        </button>
      </header>

      <div class="login-alert-body">
        <p>
          Your Google account is not currently registered for FarmRA access.
        </p>
        <p>
          Please contact
          <a href="mailto:untfarmra@gmail.com">untfarmra@gmail.com</a>
          for setup or support.
        </p>
      </div>

      <footer class="login-alert-footer">
        <button id="loginAccessModalAcknowledge" class="oauth-btn-primary" type="button">
          Got it
        </button>
      </footer>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="js/hyperframes-animations.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const modal = document.getElementById("loginAccessModal");
        const closeBtn = document.getElementById("loginAccessModalClose");
        const acknowledgeBtn = document.getElementById("loginAccessModalAcknowledge");
        const params = new URLSearchParams(globalThis.location.search || "");
        const shouldOpen = params.get("error") === "not_registered";

        if (!modal) {
          return;
        }

        const closeModal = () => {
          if (modal.open) {
            modal.close();
          }
          modal.hidden = true;
          document.body.classList.remove("modal-open");
        };

        if (closeBtn) {
          closeBtn.addEventListener("click", closeModal);
        }

        if (acknowledgeBtn) {
          acknowledgeBtn.addEventListener("click", closeModal);
        }

        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            closeModal();
          }
        });

        modal.addEventListener("close", () => {
          document.body.classList.remove("modal-open");
        });

        if (!shouldOpen) {
          return;
        }

        document.body.classList.add("modal-open");
        modal.hidden = false;

        if (typeof modal.showModal === "function") {
          modal.showModal();
        } else {
          modal.setAttribute("open", "open");
        }

        params.delete("error");
        const nextQuery = params.toString();
        const queryPart = nextQuery ? `?${nextQuery}` : "";
        const hashPart = globalThis.location.hash || "";
        const nextUrl = `${globalThis.location.pathname}${queryPart}${hashPart}`;
        globalThis.history.replaceState(null, "", nextUrl);
      });
    </script>
  </body>
</html>
