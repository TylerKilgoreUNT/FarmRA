<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/media.css" />
    <title>FarmRA</title>
  </head>
  <body class="login-page">
    <!-- Login -->
    <section class="login">
      <div class="login-container">
        <!-- Logo and Welcome Text -->
        <div class="login-logo">
          <img src="/assets/LightFarmRa.png" alt="FarmRA Logo" class="large-logo" />
          <h2>FarmRA</h2>
          <p class="welcome-text">Welcome to your farm of the future</p>
        </div>
        
        <!-- Login Card -->
        <div class="login-card">
          <div class="card-content">
            <h3>Get Started</h3>
            <p class="card-subtitle">Sign in to access your farm dashboard</p>
            
            <a href="/index.html" class="oauth-btn-primary">
              <img src="/assets/googleOAuth2.png" alt="Google sign in" class="oauth-icon">
              <span>Sign in with Google</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
