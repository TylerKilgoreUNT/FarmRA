<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/media.css">
    <title>FarmRA</title>
</head>
<body class="map-page">
    <nav id="top-bar" class="top-bar" aria-label="Top navigation">
        <div class="farmra-logo">
            <img src="/assets/FarmRA.png" alt="Farm Ra Logo">
            <span id="userGreeting" class="user-greeting"></span>
        </div>
        <div class="top-bar-left">
            <h1>FarmRA</h1>
        </div>
        <div class="top-bar-right">
            <div class="user-menu">
                <button
                    class="icon-btn"
                    title="User Settings"
                    data-action="settings"
                    id="userMenuBtn"
                >
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"
                            fill="currentColor"
                        />
                    </svg>
                </button>
                <div class="dropdown-menu" id="userDropdown" hidden>
                    <div class="menu-header">
                        <span id="userEmail" class="user-email"></span>
                    </div>
                    <div class="menu-items">
                        <a href="#" class="menu-item">
                            <span>Account Info</span>
                        </a>
                        <hr class="menu-divider" />
                        <a
                            href="/oidc/callback?logout=https://farmra.net/login.html"
                            class="menu-item text-danger"
                        >
                            <span>Log Out</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <nav id="left-panel" class="sidebar left-panel" aria-label="Secondary navigation">
        <div class="sidebar-header">
            <h3>Sensor Nodes</h3>
        </div>
        <div class="sidebar-section">
             <button class="side-btn active" data-node="node1" type="button">Loading nodes...</button>
             <button class="side-btn" data-node="node2" type="button">Loading nodes...</button>
        </div>
    </nav>
    <nav id="left-narrow" class="sidebar left-narrow" aria-label="Primary navigation">
        <div>
            <a href="index.html" class="icon-btn all" title="all" data-action="all"></a>
            <button class="icon-btn light" title="Light" data-action="light"></button>
            <button class="icon-btn moisture" title="Moisture" data-action="moisture"></button>
            <button class="icon-btn temperature" title="Temperature" data-action="temperature">
                
            </button>
        </div>
        <div>
            <a href="map.html" class="icon-btn map" title="Map" data-action="map"></a>
        </div>
    </nav>
    <main>
         <div id="map"></div>
         <script type="module">
            const NODE_STORAGE_KEY = "farmra_selected_node";
            const map = L.map("map").setView([33.254, -97.152], 17);

            L.tileLayer("https://api.maptiler.com/maps/topo-v2/{z}/{x}/{y}.png?key=ee8yik4usfu4xt3Burv3", {
                maxZoom: 19,
                attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
            }).addTo(map);

            // Define custom marker icons (larger size)
            const blueIcon = L.icon({
                iconUrl: "/assets/markerBlue.png",
                iconSize: [72, 96],
                iconAnchor: [36, 96],
                popupAnchor: [0, -96]
            });

            const greenIcon = L.icon({
                iconUrl: "/assets/markerGreen.png",
                iconSize: [72, 96],
                iconAnchor: [36, 96],
                popupAnchor: [0, -96]
            });

            const markerConfigs = [
                { nodeKey: "node1", coords: [33.254, -97.152], icon: blueIcon, fallbackName: "Node 1" },
                { nodeKey: "node2", coords: [33.255, -97.153], icon: greenIcon, fallbackName: "Node 2" }
            ];
            const markerStateByKey = {};

            function escapeHtml(value) {
                return String(value || "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#39;");
            }

            function getNodePopupHtml(nodeKey, nodeName) {
                const safeNodeName = escapeHtml(nodeName);
                return `
                    <div class="node-popup">
                        <strong>${safeNodeName}</strong><br>
                        <button type="button" class="node-popup-open-all" data-node-key="${nodeKey}">
                            Open ${safeNodeName} All Page
                        </button>
                    </div>
                `;
            }

            markerConfigs.forEach((config) => {
                const marker = L.marker(config.coords, { icon: config.icon })
                    .addTo(map)
                    .bindPopup(getNodePopupHtml(config.nodeKey, config.fallbackName));

                markerStateByKey[config.nodeKey] = {
                    marker,
                    fallbackName: config.fallbackName
                };
            });

            map.on("popupopen", (event) => {
                const popupEl = event.popup && event.popup.getElement ? event.popup.getElement() : null;
                const openAllBtn = popupEl ? popupEl.querySelector(".node-popup-open-all") : null;

                if (!openAllBtn) {
                    return;
                }

                openAllBtn.addEventListener("click", () => {
                    const nodeKey = openAllBtn.dataset.nodeKey || "node1";

                    try {
                        globalThis.localStorage.setItem(NODE_STORAGE_KEY, nodeKey);
                    } catch (error) {
                        console.warn("Unable to store selected node from map popup:", error);
                    }

                    const targetUrl = new URL("index.html", globalThis.location.href);
                    globalThis.location.href = targetUrl.toString();
                });
            });

            try {
                const response = await fetch("/farmra-api/nodes");
                if (!response.ok) {
                    throw new Error(`Failed to fetch nodes for map popups: ${response.status}`);
                }

                const nodes = await response.json();
                if (Array.isArray(nodes)) {
                    nodes.forEach((node, index) => {
                        const nodeKey = `node${index + 1}`;
                        const markerState = markerStateByKey[nodeKey];

                        if (!markerState) {
                            return;
                        }

                        const nodeName = (node && node.node_name ? String(node.node_name).trim() : "") || markerState.fallbackName;
                        markerState.marker.setPopupContent(getNodePopupHtml(nodeKey, nodeName));
                    });
                }
            } catch (error) {
                console.error("Unable to load node names for map popups:", error);
            }
         </script>
    </main>
    <dialog
        id="accountInfoModal"
        class="account-modal"
        aria-labelledby="accountInfoTitle"
        hidden
    >
        <header class="account-modal-header">
            <h2 id="accountInfoTitle">Account Info</h2>
            <button
                id="accountInfoCloseBtn"
                class="account-modal-close"
                type="button"
                aria-label="Close account info"
            >
                ×
            </button>
        </header>

        <div class="account-modal-body">
            <section class="account-card" aria-label="User details">
                <h3>User</h3>
                <div class="account-row">
                    <span class="account-label">First Name</span>
                    <span id="accountFirstName" class="account-value">Loading...</span>
                </div>
                <div class="account-row">
                    <span class="account-label">Last Name</span>
                    <span id="accountLastName" class="account-value">Loading...</span>
                </div>
                <div class="account-row">
                    <span class="account-label">Email</span>
                    <span id="accountEmail" class="account-value">Loading...</span>
                </div>
            </section>

            <section class="account-card" aria-label="Assigned nodes">
                <h3>Assigned Nodes</h3>
                <ul id="accountNodesList" class="account-node-list">
                    <li>Loading...</li>
                </ul>
            </section>
        </div>
    </dialog>
    <div id="overlay" class="overlay" hidden></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/hyperframes-animations.js" defer></script>
</body>
</html>
